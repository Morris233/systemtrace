name: Windows build and tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - run: dotnet restore --locked-mode
      - run: dotnet build --configuration Release --no-restore
      - run: dotnet test --configuration Release --no-build --logger trx
      - run: dotnet format --verify-no-changes --no-restore
      - name: Verify self-contained Windows package
        shell: pwsh
        run: ./scripts/Build-Portable.ps1 -OutputDirectory artifacts/ci-package
      - uses: actions/upload-artifact@v7
        with:
          name: portable-ci
          path: artifacts/ci-package/*
          if-no-files-found: error
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: test-results
          path: '**/TestResults/*.trx'
          if-no-files-found: warn
